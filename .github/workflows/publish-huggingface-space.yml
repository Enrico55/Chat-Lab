name: Publish Humanity Commons Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'huggingface-space/**'
      - '.github/workflows/publish-huggingface-space.yml'

permissions:
  contents: read

jobs:
  publish:
    if: ${{ secrets.HF_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Hugging Face Hub client
        run: python -m pip install --upgrade huggingface_hub

      - name: Create or update Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "ricox55/humanity-commons"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="space",
              folder_path="huggingface-space",
              commit_message="Sync Humanity Commons agent challenge hub",
          )
          print(f"Published https://huggingface.co/spaces/{repo_id}")
          PY
