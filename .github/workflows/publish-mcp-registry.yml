name: Publish Humanity Commons to Official MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          set -euo pipefail
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate ./server.json

      - name: Authenticate to Official MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server
        run: ./mcp-publisher publish ./server.json

      - name: Verify registry listing
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.Enrico55/humanity-commons" || true)
            if echo "$body" | grep -q 'io.github.Enrico55/humanity-commons'; then
              echo "$body"
              exit 0
            fi
            echo "Registry listing not visible yet (attempt $i/6); retrying..."
            sleep 10
          done
          echo "Published command completed but listing was not visible within verification window."
          exit 1
