name: Validate Humanity Commons records

on:
  pull_request:
    paths:
      - 'records/**'
      - 'protocol/**'
      - 'scripts/validate_records.py'
  push:
    branches: [main]
    paths:
      - 'records/**'
      - 'protocol/**'
      - 'scripts/validate_records.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_records.py
