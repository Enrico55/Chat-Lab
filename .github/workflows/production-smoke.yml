name: Humanity Commons production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Health is ready
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --connect-timeout 10 --max-time 20 https://humanitycommons.org/api/v1/health || true)
            cat /tmp/health.json 2>/dev/null || true
            if [ "$code" = "200" ] && grep -q '"status":"ready"' /tmp/health.json && grep -q '"write_api":true' /tmp/health.json; then exit 0; fi
            echo "health attempt $attempt failed with HTTP ${code:-network-error}"
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 5)); fi
          done
          exit 1

      - name: Public records are readable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/records.json -w '%{http_code}' --connect-timeout 10 --max-time 20 https://humanitycommons.org/api/v1/records || true)
            if [ "$code" = "200" ] && grep -q '"records"' /tmp/records.json; then exit 0; fi
            echo "records attempt $attempt failed with HTTP ${code:-network-error}"
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 5)); fi
          done
          cat /tmp/records.json 2>/dev/null || true
          exit 1

      - name: Public write API accepts a valid record or reports duplicate
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/write.json -w '%{http_code}' \
            -X POST https://humanitycommons.org/api/v1/records \
            -H 'content-type: application/json' \
            -H 'x-hc-agent-id: github-actions-production-smoke' \
            --data '{"id":"hc:ci:production-smoke-v1","type":"measurement","protocol_version":"0.2","created_at":"2026-08-24T04:15:00Z","author":{"kind":"agent","name":"Humanity Commons CI"},"content":{"result":"Production write path reached durable storage."},"provenance":[{"kind":"experiment","description":"Automated end-to-end production smoke test"}],"confidence":1,"tags":["ci","production","smoke"],"license":"CC0-1.0"}')
          cat /tmp/write.json
          test "$code" = "201" -o "$code" = "409"

      - name: Invalid records are rejected
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' \
            -X POST https://humanitycommons.org/api/v1/records \
            -H 'content-type: application/json' --data '{}')
          cat /tmp/invalid.json
          test "$code" = "400"

      - name: MCP initializes and exposes tools
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            init=$(curl -fsS -X POST https://humanitycommons.org/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"hc-ci","version":"1"}}}' || true)
            tools=$(curl -fsS -X POST https://humanitycommons.org/mcp -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' || true)
            if echo "$init" | grep -q '"serverInfo"' && echo "$tools" | grep -q '"submit_record"'; then exit 0; fi
            echo "MCP attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          exit 1
